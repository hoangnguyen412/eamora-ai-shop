services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: eamora
      POSTGRES_PASSWORD: eamora_dev_password
      POSTGRES_DB: eamora
    ports:
      - "5432:5432"
    volumes:
      - eamora-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eamora -d eamora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eamora-postgres-data: