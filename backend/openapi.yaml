openapi: 3.0.0
info:
  title: Eamora AI Shop API
  version: 1.0.0
  description: API Contract cho đồ án AI-Driven B2C Marketplace
servers:
  - url: http://localhost:4000
paths:
  /health:
    get:
      summary: Kiểm tra trạng thái API và Database
      responses:
        '200': { description: OK }
  /api/auth/register:
    post:
      summary: Đăng ký tài khoản
      responses:
        '201': { description: Created }
  /api/auth/login:
    post:
      summary: Đăng nhập lấy JWT
      responses:
        '200': { description: OK }
  /api/auth/me:
    get:
      summary: Lấy thông tin user hiện tại
      responses:
        '200': { description: OK }
  /api/products:
    get:
      summary: Danh sách sản phẩm (từ khóa, filter và phân trang)
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Từ khóa khớp tên sản phẩm, thương hiệu hoặc danh mục
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: brand
          schema: { type: string }
        - in: query
          name: minPrice
          schema: { type: number, minimum: 0 }
        - in: query
          name: maxPrice
          schema: { type: number, minimum: 0 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 12 }
      responses:
        '200': { description: OK; gồm data, pagination, filterOptions và offers còn hàng (listingId, shopId, shopName, price, stock) cho từng sản phẩm }
        '400': { description: Invalid price range }
  /api/products/{id}:
    get:
      summary: Chi tiết sản phẩm, gồm các listing còn hàng để chọn nhà bán
      responses:
        '200': { description: OK }
  /api/interactions:
    post:
      summary: Ghi nhận tương tác của buyer với sản phẩm
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, action]
              properties:
                productId: { type: string }
                action:
                  type: string
                  enum: [view, click, cart, buy]
      responses:
        '201': { description: Interaction recorded }
        '400': { description: Invalid interaction payload }
        '401': { description: Authentication required }
        '404': { description: Product not found }
  /api/search/sessions:
    post:
      summary: Lưu query và bộ lọc tìm kiếm (hỗ trợ guest)
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [queryText]
              properties:
                queryText: { type: string, maxLength: 500 }
                filters: { type: object, additionalProperties: true }
      responses:
        '201': { description: Search session created }
        '400': { description: Invalid search session payload }
  /api/search/sessions/{id}/clicks:
    post:
      summary: Ghi nhận sản phẩm được click trong search session
      security:
        - {}
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: string }
      responses:
        '201': { description: Click recorded }
        '400': { description: Invalid click payload }
        '403': { description: Search session belongs to another user }
        '404': { description: Search session or product not found }
  /api/products/{id}/reviews:
    get:
      summary: Lấy danh sách đánh giá
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Product not found }
    post:
      summary: Buyer tạo đánh giá mới
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 2000 }
      responses:
        '201': { description: Created }
        '400': { description: Invalid review payload }
        '401': { description: Authentication required }
        '403': { description: Buyer role required }
        '404': { description: Product not found }
  /api/orders:
    post:
      summary: Tạo đơn hàng
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, shipping_info]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [listingId, quantity]
                    properties:
                      listingId: { type: string }
                      quantity: { type: integer, minimum: 1 }
                shipping_info:
                  type: object
                  required: [fullName, phone, address, city]
                  properties:
                    fullName: { type: string }
                    phone: { type: string }
                    address: { type: string }
                    city: { type: string }
                payment_method:
                  type: string
                  enum: [cod, vnpay, credit_card]
      responses:
        '201': { description: Created }
  /api/orders/me:
    get:
      summary: Lịch sử mua hàng
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK }
  /api/orders/{id}:
    get:
      summary: Chi tiết đơn hàng của buyer hoặc seller sở hữu listing
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '403': { description: Forbidden }
        '404': { description: Not found }
  /api/orders/{id}/status:
    patch:
      summary: Cập nhật trạng thái đơn hàng (seller sở hữu đơn)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [processing, shipped, delivered, cancelled]
      responses:
        '200': { description: OK }
        '403': { description: Forbidden }
        '409': { description: Invalid status transition }
  /api/seller/listings:
    get:
      summary: Lấy danh sách listing của seller
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK; mỗi listing có totalSold và status }
        '401': { description: Authentication required }
        '403': { description: Seller role required }
  /api/seller/orders:
    get:
      summary: Lấy đơn hàng có listing thuộc seller
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK; đơn có items, sellerAmount, productName và lineTotal }
        '401': { description: Authentication required }
        '403': { description: Seller role required }
  /api/seller/stats:
    get:
      summary: Thống kê listing, đơn hàng và doanh thu của seller
      security:
        - bearerAuth: []
      responses:
        '200': { description: OK; doanh thu không gồm phí ship và đơn đã hủy }
        '401': { description: Authentication required }
        '403': { description: Seller role required }
  /api/search/semantic:
    post:
      summary: Tìm kiếm ngữ nghĩa (gọi sang AI)
      responses:
        '200': { description: OK }
  /api/chat/message:
    post:
      summary: Chat với RAG Assistant
      responses:
        '200': { description: OK }
  /api/agent/watch:
    post:
      summary: Thêm sản phẩm vào Watchlist
      responses:
        '201': { description: Created }
  /api/agent/rules:
    put:
      summary: Cập nhật luật Auto-buy
      responses:
        '200': { description: OK }
  /api/agent/history:
    get:
      summary: Lịch sử giá & Auto-buy
      responses:
        '200': { description: OK }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT